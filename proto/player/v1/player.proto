syntax = "proto3";

package player.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/MrTraan/urban-octo-guide/gen/player/v1;playerv1";

// PlayerService powers the Player Profile feature of a game client.
service PlayerService {
  // CreateProfile is idempotent: if the profile already exists it is returned unchanged.
  rpc CreateProfile(CreateProfileRequest) returns (Profile);
  // GetProfile returns NOT_FOUND when the player has no profile.
  rpc GetProfile(GetProfileRequest) returns (Profile);
  // UpdateProfile changes only the fields that are set in the request.
  rpc UpdateProfile(UpdateProfileRequest) returns (Profile);
  // RecordEvent stores one gameplay event for a player.
  rpc RecordEvent(RecordEventRequest) returns (Event);
  // ListRecentEvents returns a player's newest events first.
  rpc ListRecentEvents(ListRecentEventsRequest) returns (ListRecentEventsResponse);
  // GetSessionSummary returns everything the client needs at session start.
  rpc GetSessionSummary(GetSessionSummaryRequest) returns (GetSessionSummaryResponse);
}

message Profile {
  string player_id = 1;
  string display_name = 2;
  string country = 3; // ISO 3166-1 alpha-2, e.g. "FR"
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message Event {
  string id = 1;
  string player_id = 2;
  string type = 3; // e.g. "level_complete"
  google.protobuf.Timestamp timestamp = 4;
  google.protobuf.Struct payload = 5; // free-form JSON object
}

message CreateProfileRequest {
  string player_id = 1;
  string display_name = 2;
  string country = 3;
}

message GetProfileRequest {
  string player_id = 1;
}

message UpdateProfileRequest {
  string player_id = 1;
  optional string display_name = 2;
  optional string country = 3;
}

message RecordEventRequest {
  string player_id = 1;
  string type = 2;
  optional google.protobuf.Timestamp timestamp = 3; // defaults to now
  google.protobuf.Struct payload = 4;
}

message ListRecentEventsRequest {
  string player_id = 1;
  int32 limit = 2; // 0 means 20, capped at 100
}

message ListRecentEventsResponse {
  repeated Event events = 1;
}

message GetSessionSummaryRequest {
  string player_id = 1;
  int32 recent_limit = 2; // 0 means 20, capped at 100
  int32 window_days = 3; // 0 means 7, capped at 90
}

message EventCount {
  string type = 1;
  int64 count = 2;
}

message GetSessionSummaryResponse {
  Profile profile = 1;
  repeated Event recent_events = 2;
  repeated EventCount counts = 3; // events by type over the window
}

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      GRPC_ADDR: ":8080"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DB: "player"
    depends_on:
      mongo:
        condition: service_healthy
